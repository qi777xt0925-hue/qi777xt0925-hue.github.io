name: 가이드 글 생성

# 매주 금요일 오전 9시(KST)에 한 편 생성해 main에 바로 올립니다.
# 사람의 승인 없이 발행되므로, 사람이 하던 검토를 validate.mjs가 대신합니다.
# 검수를 통과하지 못한 글은 site/_drafts/ 로 격리되고 사이트에 올라가지 않습니다.
# 격리가 생기면 이슈가 열려 메일로 알려줍니다.
#
# 글 생성은 Anthropic API를 호출하므로 실행할 때마다 비용이 듭니다(1편당 약 $0.35).
# 그래서 이 워크플로는 두 가지를 지킵니다.
#   1) 돈을 쓰기 전에 먼저 점검한다 (API 키·요청 편수·큐 상태)
#   2) 돈을 쓴 뒤에는 결과물을 잃지 않는다 (검수 결과와 무관하게 아티팩트로 보관)
#
# 2026-08-22 실행에서 PR 생성 권한이 없어 마지막 단계가 실패하면서,
# 이미 생성해 비용을 지불한 글을 통째로 날린 적이 있습니다.
# 아래 구조는 그 재발을 막기 위한 것입니다.

on:
  # ── 자동 발행 중지 (2026-08-30) ──────────────────────────
  # 크레딧을 아끼기 위해 정기 실행을 껐습니다. 글 한 편에 약 $0.5가 나가는데,
  # 지금은 Claude Code 세션에서 직접 써서 발행하고 있어 크레딧이 들지 않습니다.
  #
  # 다시 켜려면 아래 두 줄의 맨 앞 '# ' 를 지우면 됩니다.
  # 그러면 매주 금요일 오전 9시(KST)에 한 편씩 자동으로 생성·발행됩니다.
  #
  # schedule:
  #   - cron: '0 0 * * 5' # UTC 금 00:00 = KST 금 09:00

  # 수동 실행은 그대로 됩니다. Actions 탭에서 직접 눌러야만 돌아갑니다.
  workflow_dispatch:
    inputs:
      count:
        description: '생성할 글 수'
        required: false
        default: '1'
      pr:
        description: 'main에 바로 올리지 않고 PR로 검토받기'
        type: boolean
        required: false
        default: false
      dry_run:
        description: '점검만 하고 생성하지 않음 (비용 0)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 돈을 쓰기 전에 여기서 다 막습니다 ──────────────────
      - name: 사전 점검
        id: preflight
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          fail=0

          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY 시크릿이 없습니다. 생성을 시작하지 않습니다."
            fail=1
          else
            echo "API 키 확인"
          fi

          COUNT="${{ github.event.inputs.count || '1' }}"
          case "$COUNT" in
            ''|*[!0-9]*)
              echo "::error::생성할 글 수가 숫자가 아닙니다: $COUNT"
              fail=1
              ;;
            *)
              if [ "$COUNT" -gt 10 ]; then
                echo "::error::한 번에 ${COUNT}편을 생성하려 합니다. 비용이 큽니다. 나눠서 실행하세요."
                fail=1
              fi
              ;;
          esac

          # 정기 실행은 사람이 보지 않으므로 검수를 통과하면 main에 바로 올립니다.
          # 수동 실행에서 pr 체크박스를 켜면 PR로 돌립니다.
          if [ "${{ github.event.inputs.pr }}" = "true" ]; then
            echo "mode=pr" >> "$GITHUB_OUTPUT"
            echo "발행 방식: PR (수동 검토)"
          else
            echo "mode=direct" >> "$GITHUB_OUTPUT"
            echo "발행 방식: main에 직접 푸시 (검수 통과 시)"
          fi

          PENDING=$(node -e "const t=require('./pipeline/topics.json');const a=Array.isArray(t)?t:(t.topics||[]);console.log(a.filter(x=>!x.published).length)")
          COST=$(node -e "console.log((Number('$COUNT')*0.35).toFixed(2))")
          echo "대기 주제 ${PENDING}개 · 생성 요청 ${COUNT}편 · 예상 비용 약 \$${COST}"

          {
            echo "### 사전 점검"
            echo ""
            echo "- 대기 주제: ${PENDING}개"
            echo "- 생성 요청: ${COUNT}편"
            echo "- 예상 비용: 약 \$${COST}"
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$fail" -eq 0 ] || exit 1

      - name: 점검만 하고 종료
        if: github.event.inputs.dry_run == 'true'
        run: |
          echo "dry_run 이므로 여기서 멈춥니다. 비용이 발생하지 않았습니다."
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**dry_run: 생성하지 않고 종료했습니다. 비용 0원.**" >> "$GITHUB_STEP_SUMMARY"

      - name: 의존성 설치
        if: github.event.inputs.dry_run != 'true'
        working-directory: pipeline
        run: npm ci || npm install

      # ── 여기서부터 비용이 발생합니다 ──────────────────────
      - name: 주제 큐 보충
        if: github.event.inputs.dry_run != 'true'
        working-directory: pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node replenish.mjs

      - name: 글 생성
        if: github.event.inputs.dry_run != 'true'
        working-directory: pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node generate.mjs --count "${{ github.event.inputs.count || '1' }}"

      # 이번 실행에서 새로 생긴 글만 검수합니다.
      # 이미 발행된 옛 글까지 검사하면, 지금 기준에 안 맞는 과거 글 때문에
      # 멀쩡한 새 글까지 발행이 막힙니다.
      - name: 새 글 목록 확인
        if: github.event.inputs.dry_run != 'true'
        id: fresh
        run: |
          SLUGS=$(git status --porcelain site/posts \
            | awk '{print $NF}' \
            | sed -n 's#^site/posts/\(.*\)\.html$#\1#p' \
            | paste -sd, -)
          echo "slugs=$SLUGS" >> "$GITHUB_OUTPUT"
          if [ -z "$SLUGS" ]; then
            echo "새로 생긴 글이 없습니다."
          else
            echo "새 글: $SLUGS"
          fi

      # ── 사람이 하던 검토를 여기서 대신합니다 ──────────────
      # 낡은 요율, 얇은 분량, 출처 없음, 깨진 링크, 초안 흔적, 중복을 검사합니다.
      # 탈락한 글은 site/_drafts/ 로 옮겨지고 주제는 다시 대기 상태가 됩니다.
      - name: 자동 검수
        if: github.event.inputs.dry_run != 'true' && steps.fresh.outputs.slugs != ''
        id: validate
        continue-on-error: true
        working-directory: pipeline
        run: node validate.mjs --only "${{ steps.fresh.outputs.slugs }}" --quarantine

      # 검수에서 격리가 일어났을 수 있으므로 목록과 사이트맵은 검수 뒤에 다시 만듭니다.
      - name: 목록·사이트맵 재생성
        if: github.event.inputs.dry_run != 'true'
        working-directory: pipeline
        run: node build.mjs

      # 비용을 지불한 결과물은 검수 결과와 무관하게 보관합니다.
      # 격리된 글도 _drafts 에 들어 있어 여기서 그대로 내려받을 수 있습니다.
      - name: 생성물 보관
        if: always() && github.event.inputs.dry_run != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: generated-posts
          path: |
            site/posts/
            site/_drafts/
            pipeline/topics.json
          retention-days: 90
          if-no-files-found: warn

      - name: 변경 사항 확인
        if: github.event.inputs.dry_run != 'true'
        id: diff
        run: |
          # site/_drafts/ 는 .gitignore에 있으므로 격리된 초안은 애초에 커밋되지 않습니다.
          # 새 글이 전부 격리돼도 큐 보충 결과(topics.json)는 남으므로 그것만이라도 커밋합니다.
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "커밋할 변경이 없습니다."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --porcelain
          fi

          if [ -z "$(git status --porcelain site/posts)" ]; then
            echo "posts=false" >> "$GITHUB_OUTPUT"
            echo "발행할 새 글은 없습니다. (검수 탈락이거나 생성 실패)"
          else
            echo "posts=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 커밋
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add -A
          if [ "${{ steps.diff.outputs.posts }}" = "true" ]; then
            git commit -m "글 발행: $(date -u +%Y-%m-%d)"
          else
            git commit -m "주제 큐 보충: $(date -u +%Y-%m-%d)"
          fi

      # 발행할 글이 없고 큐 보충만 있었다면 PR로 돌릴 이유가 없으므로 이 경우도 바로 푸시합니다.
      - name: main에 직접 푸시
        if: steps.diff.outputs.changed == 'true' && (steps.preflight.outputs.mode == 'direct' || steps.diff.outputs.posts != 'true')
        run: |
          git push
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.diff.outputs.posts }}" = "true" ]; then
            echo "**검수를 통과해 main에 발행했습니다.** 배포와 색인 통보가 이어서 돌아갑니다." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "발행할 글은 없었고, 주제 큐 보충 결과만 저장했습니다." >> "$GITHUB_STEP_SUMMARY"
          fi

      # PR 생성이 막혀 있어도 브랜치는 남기고, 수동으로 열 수 있는 링크를 띄웁니다.
      # 실패해도 워크플로를 죽이지 않습니다. 글은 이미 브랜치와 아티팩트에 있습니다.
      - name: Pull Request 생성
        if: steps.diff.outputs.posts == 'true' && steps.preflight.outputs.mode == 'pr'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="post/$(date -u +%Y%m%d-%H%M)"
          git checkout -b "$BRANCH"
          git push -u origin "$BRANCH"
          echo "브랜치를 올렸습니다: $BRANCH"

          if gh pr create \
               --title "새 가이드 글 ($(date -u +%Y-%m-%d))" \
               --body "자동 생성된 초안입니다. 자동 검수는 통과했지만 수동 검토를 요청했습니다." \
               --base "${{ github.ref_name }}" \
               --head "$BRANCH"; then
            echo "PR을 열었습니다." >> "$GITHUB_STEP_SUMMARY"
          else
            URL="${{ github.server_url }}/${{ github.repository }}/compare/${{ github.ref_name }}...${BRANCH}?expand=1"
            echo "::warning::PR 자동 생성에 실패했습니다. 브랜치 ${BRANCH} 는 그대로 남아 있습니다."
            {
              echo "### PR을 자동으로 열지 못했습니다"
              echo ""
              echo "글은 안전합니다. 브랜치 \`${BRANCH}\` 에 커밋돼 있고, 이 실행의 아티팩트에도 들어 있습니다."
              echo ""
              echo "직접 여시려면: [${BRANCH} PR 열기](${URL})"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── 검수에서 걸린 글이 있으면 이슈로 알립니다 ─────────
      # 사람이 Actions 탭을 들여다보지 않으므로, 메일이 가는 이슈로 알려야 합니다.
      - name: 검수 탈락 알림
        if: always() && steps.validate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # 라벨이 없으면 gh가 이슈 생성 자체를 거부합니다. 미리 만들어 둡니다.
          gh label create "검수" --color FBCA04 --description "자동 검수에서 걸린 글" 2>/dev/null || true

          gh issue create \
            --title "자동 검수에서 글이 걸렸습니다 ($(date -u +%Y-%m-%d))" \
            --label "검수" \
            --body "$(printf '%s\n' \
              "이번 주 글이 자동 검수를 통과하지 못해 발행하지 않았습니다." \
              "" \
              "글은 사라지지 않았습니다. \`site/_drafts/\` 에 격리돼 있고, 주제는 다시 대기 상태로 돌아가 다음 주에 새로 시도합니다." \
              "" \
              "무엇이 걸렸는지: [실행 기록에서 '자동 검수' 단계]($RUN_URL)" \
              "" \
              "손볼 필요는 없습니다. 다음 주에 같은 주제로 다시 생성됩니다. 매주 반복되면 그때 주제를 바꾸는 걸 고려하세요.")" \
            || gh issue create \
                 --title "자동 검수에서 글이 걸렸습니다 ($(date -u +%Y-%m-%d))" \
                 --body "이번 주 글이 자동 검수를 통과하지 못해 발행하지 않았습니다. 글은 site/_drafts/ 에 있고 주제는 대기열로 돌아갔습니다. 자세한 내용: $RUN_URL" \
            || echo "::warning::이슈 생성에 실패했습니다. 실행 요약을 직접 확인하세요: $RUN_URL"
