name: 사이트 배포

# site/ 가 바뀌면 GitHub Pages에 그대로 올립니다.
# 저장소 루트가 아니라 site/ 만 배포되므로, 다른 파일은 공개되지 않습니다.
on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      # 배포된 뒤, 이번 푸시에서 바뀐 페이지를 네이버·Bing에 통보합니다.
      # IndexNow는 구글이 지원하지 않습니다. 구글은 Search Console에서 수동 요청하세요.
      # 실패해도 배포에 영향이 없도록 continue-on-error 로 둡니다.
      - name: 검색엔진에 변경 알림 (IndexNow)
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          KEY: 77088601589f5d3daae39f8ac9c025ac
          HOST: qi777xt0925-hue.github.io
          SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -u
          BEFORE="$BEFORE_SHA"
          # 첫 푸시나 강제 푸시면 직전 커밋과 비교
          case "$BEFORE" in
            ''|0000000000000000000000000000000000000000) BEFORE="${SHA}~1" ;;
          esac
          if ! git rev-parse --verify -q "$BEFORE^{commit}" > /dev/null; then
            echo "비교 기준 커밋이 없어 건너뜁니다: $BEFORE"
            exit 0
          fi

          # 바뀐 site/ 아래 html 만 골라 URL 로 바꿉니다.
          # git pathspec 의 ** 는 의도대로 동작하지 않으므로 grep 으로 거릅니다.
          # index.html 은 디렉터리 주소로 정규화합니다.
          URLS=$(git diff --name-only --diff-filter=d "$BEFORE" "$SHA" -- site \
                 | { grep -E '\.html
 || true; } \
                 | sed "s|^site/|https://$HOST/|" \
                 | sed "s|/index\.html$|/|")

          if [ -z "$URLS" ]; then
            echo "바뀐 페이지가 없어 통보하지 않습니다."
            exit 0
          fi

          echo "통보할 페이지:"
          echo "$URLS" | sed 's/^/  /'

          BODY=$(printf '%s\n' "$URLS" | jq -R . | jq -s \
            --arg host "$HOST" \
            --arg key "$KEY" \
            --arg loc "https://$HOST/$KEY.txt" \
            '{host: $host, key: $key, keyLocation: $loc, urlList: .}')

          # 만들어진 JSON 이 유효한지 먼저 확인
          if ! printf '%s' "$BODY" | jq -e . > /dev/null 2>&1; then
            echo "JSON 생성에 실패해 통보를 건너뜁니다."
            exit 0
          fi

          for EP in https://api.indexnow.org/indexnow https://searchadvisor.naver.com/indexnow; do
            CODE=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' -X POST "$EP" \
              -H 'Content-Type: application/json; charset=utf-8' \
              --data "$BODY" || echo 000)
            case "$CODE" in
              200|202) echo "$EP -> HTTP $CODE (접수됨)" ;;
              *)       echo "$EP -> HTTP $CODE (실패, 배포에는 영향 없음)" ;;
            esac
          done
