name: 사이트 점검

# "있어야 할 것이 없다"를 잡는 점검입니다. 비용 0원(API 호출 없음).
#
# 검수기는 있는 글이 맞는지만 봅니다. 아래 두 사고는 오류가 하나도 없어서 아무도 몰랐습니다.
#   - 2026-08-30 ~ 09-24: 정기 발행이 꺼진 채 3주.
#   - 2026-09-28: 커밋된 글이 배포되지 않은 채 사흘.
# 그래서 매주 라이브 사이트를 직접 열어 보고, 이상하면 메일이 가는 이슈로 알립니다.
# 점검 내용은 pipeline/health.mjs 맨 위에 적혀 있습니다.
on:
  schedule:
    # 발행(월요일) 이틀 뒤. 월요일 발행이 빠졌으면 여기서 잡힙니다.
    - cron: '0 0 * * 3' # UTC 수 00:00 = KST 수 09:00
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 라이브 사이트 점검
        id: health
        continue-on-error: true
        working-directory: pipeline
        run: node health.mjs

      - name: 결과 요약
        if: always()
        run: cat pipeline/health-report.md >> "$GITHUB_STEP_SUMMARY" || true

      # 같은 문제로 매주 새 이슈가 쌓이지 않도록, 열린 점검 이슈가 있으면 댓글만 답니다.
      - name: 문제 알림
        if: steps.health.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '\n실행 기록: %s\n' "$RUN_URL" >> pipeline/health-report.md
          gh label create "점검" --color D93F0B --description "사이트 점검에서 문제 발견" 2>/dev/null || true

          OPEN=$(gh issue list --label "점검" --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body-file pipeline/health-report.md \
              || echo "::warning::이슈 댓글을 달지 못했습니다: $RUN_URL"
          else
            gh issue create --title "사이트 점검에서 문제가 나왔습니다 ($(date -u +%Y-%m-%d))" \
                 --label "점검" --body-file pipeline/health-report.md \
              || gh issue create --title "사이트 점검에서 문제가 나왔습니다 ($(date -u +%Y-%m-%d))" \
                   --body-file pipeline/health-report.md \
              || echo "::warning::이슈 생성에 실패했습니다: $RUN_URL"
          fi
          exit 1
